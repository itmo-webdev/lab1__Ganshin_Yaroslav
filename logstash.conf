input {
  file {
    path => "/app/logs/app.json.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    tags => ["news-api"]
  }
}

filter {
  # лишние поля
  mutate {
    remove_field => ["@version", "host", "path"]
  }
  
  # timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # поле для уровня лога
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "news-api-logs-%{+YYYY.MM.dd}"
  }
  
  # Для отладки- вывод в консоль
  stdout {
    codec => rubydebug
  }
}