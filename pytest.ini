[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    -v
markers =
    unit: unit tests
    integration: integration tests
    e2e: end-to-end tests
    slow: slow tests